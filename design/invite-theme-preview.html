body{background:#080906}
.iv-page{position:relative;min-height:100vh;padding-bottom:calc(130.0px + env(safe-area-inset-bottom));color:#f2e8d5;overflow:hidden}

.iv-bg{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
.iv-mark{position:absolute;white-space:nowrap;font-weight:900;letter-spacing:-3.0px;color:#f2e8d5;line-height:1}
.iv-mark.m1{top:20.0px;left:390.0px;font-size:150.0px;opacity:.09;transform:rotate(90deg);transform-origin:left top;filter:blur(5.0px)}
.iv-mark.m2{top:165.0px;left:-30.0px;font-size:115.0px;opacity:.07;filter:blur(8.0px)}
.iv-mark.m3{top:350.0px;left:90.0px;font-size:100.0px;opacity:.065;filter:blur(3.0px)}
.iv-streaks{position:absolute;left:0;top:0;right:0;height:550.0px;background:repeating-linear-gradient(90deg,rgba(242,232,213,.025) 0,rgba(242,232,213,.025) 1.5px,transparent 1.5px,transparent 23.0px,rgba(242,232,213,.015) 23.0px,rgba(242,232,213,.015) 25.0px,transparent 25.0px,transparent 59.0px);filter:blur(2.0px);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 55%,transparent 100%)}
.iv-glow{position:absolute;left:-100.0px;top:130.0px;width:360.0px;height:360.0px;border-radius:50%;background:radial-gradient(circle,rgba(228,71,45,.12) 0%,rgba(228,71,45,0) 70%)}

.iv-nav{position:relative;z-index:2;display:flex;align-items:center;padding-left:12.0px;box-sizing:content-box}
.iv-back{width:32.0px;height:32.0px;display:flex;align-items:center;justify-content:center}
.iv-back-arrow{width:11.0px;height:11.0px;border-left:2.0px solid #f2e8d5;border-bottom:2.0px solid #f2e8d5;transform:rotate(45deg);margin-left:4.0px}

.iv-body{position:relative;z-index:1;padding:14.0px 22.0px 0}
.iv-title{font-family:"Invite Serif","Songti SC","STSong","SimSun",serif;font-size:26.0px;font-weight:800;line-height:1.3;letter-spacing:0.5px;transform:rotate(-3deg);transform-origin:left center}
